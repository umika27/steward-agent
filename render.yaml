# MCP only. Creating this Blueprint in Render deploys it; review before applying.
services:
  - type: web
    name: steward-mcp
    runtime: python
    plan: 0.5c-512mb
    autoDeployTrigger: 'off'
    buildCommand: python -m pip install -r integrations/steward_mcp/requirements.txt
    startCommand: python -B -m integrations.steward_mcp.server
    healthCheckPath: /healthz
    disk:
      name: steward-mcp-memory
      mountPath: /var/data/steward_mcp
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_DATABASE_PATH
        value: /var/data/steward_mcp/runtime.sqlite3
      - key: MCP_SCENARIO
        value: normal
      - key: MCP_AUTH_TOKEN
        sync: false

  # Independent GNANI vendor voice rail; Steward's five tools remain on steward-mcp.
  - type: web
    name: gnani-voice-rail
    runtime: python
    plan: 0.5c-512mb
    autoDeployTrigger: 'off'
    buildCommand: python -m pip install -r integrations/gnani_voice/requirements.txt
    startCommand: python -B -m integrations.gnani_voice.server
    healthCheckPath: /healthz
    disk:
      name: gnani-voice-evidence
      mountPath: /var/data/gnani_voice
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: GNANI_VOICE_HOST
        value: 0.0.0.0
      - key: GNANI_EVIDENCE_PATH
        value: /var/data/gnani_voice/calls.jsonl
      - key: GNANI_API_KEY
        sync: false
      - key: GNANI_MCP_AUTH_TOKEN
        sync: false

  # Independent logistics simulation. HTTP mock and thin MCP bridge share one service.
  - type: web
    name: delhivery-mock-rail
    runtime: python
    plan: 0.5c-512mb
    autoDeployTrigger: 'off'
    buildCommand: python -m pip install -r integrations/delhivery_mock/requirements.txt
    startCommand: python -B -m integrations.delhivery_mock.server
    healthCheckPath: /healthz
    disk:
      name: delhivery-mock-facts
      mountPath: /var/data/delhivery_mock
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DELHIVERY_HOST
        value: 0.0.0.0
      - key: DELHIVERY_DATABASE_PATH
        value: /var/data/delhivery_mock/shipments.sqlite3
      - key: DELHIVERY_SCENARIO
        value: NORMAL_SERVICEABLE
      - key: DELHIVERY_WAREHOUSE_NAME
        value: Steward Mock Warehouse
      - key: DELHIVERY_MOCK_TOKEN
        sync: false
      - key: DELHIVERY_MCP_AUTH_TOKEN
        sync: false
